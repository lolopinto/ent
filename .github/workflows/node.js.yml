# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - python/**
      - /examples/**
      - .github/**
      - docs/**

defaults: 
  run: 
    working-directory: ./ts

jobs:
  build:

    runs-on: ubuntu-latest
    
    # Service containers to run with `build`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:18.1
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    strategy:
      matrix:
        node-version: [20.19.0, 22.12.0, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ts/package-lock.json

    - run: npm ci 
    - run: npm run build --if-present 
    - run: npm test -- --runInBand
      env:
        POSTGRES_PASSWORD: 'postgres'
        POSTGRES_USER: 'postgres'
    - run: npm run test:engine-contract
    - run: npm run prepare-code
    - run: npm run test:package

  unsupported-commonjs-boundary:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 22.11.0
      uses: actions/setup-node@v6
      with:
        node-version: 22.11.0
        cache: 'npm'
        cache-dependency-path: ts/package-lock.json

    - run: npm ci
    - run: npm run prepare-code
    - run: npm run test:package:unsupported-node

  companion-packages:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - ent-email
          - ent-graphql-tests
          - ent-passport
          - ent-password
          - ent-pgvector
          - ent-phonenumber
          - ent-postgis
          - ent-soft-delete

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: ts/packages/${{ matrix.package }}/package-lock.json

    - run: npm ci
      working-directory: ./ts
    - run: npm run prepare-code
      working-directory: ./ts
    - run: npm ci
      working-directory: ./ts/packages/${{ matrix.package }}
    - run: node ts/scripts/install_local_ent.mjs ts/packages/${{ matrix.package }}
      working-directory: ./
    - run: npm run build
      working-directory: ./ts/packages/${{ matrix.package }}
    - run: npm test -- --runInBand
      working-directory: ./ts/packages/${{ matrix.package }}
    - run: node ts/scripts/companion_package_smoke.mjs ts/packages/${{ matrix.package }}
      working-directory: ./
    - run: npm pack --dry-run
      working-directory: ./ts/packages/${{ matrix.package }}
