name: New Docker image

on:
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/new_docker_image.yml
      - release_image/main.go
      - release_image/docker_version.txt
      - release_image/tsent_version.txt
      - release_image/auto_schema_version.txt
  push:
    branches: [ main ]
    paths:
      - release_image/main.go
      - release_image/docker_version.txt
      - release_image/tsent_version.txt
      - release_image/auto_schema_version.txt

permissions:
  contents: read


jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: go.sum

    - name: Validate release version files
      run: |
        set -euo pipefail
        changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
        echo "${changed}"

        if echo "${changed}" | grep -Eq '^release_image/(auto_schema_version|tsent_version)\.txt$' &&
          ! echo "${changed}" | grep -qx 'release_image/docker_version.txt'; then
          echo "release_image/docker_version.txt must change with auto_schema_version.txt or tsent_version.txt"
          exit 1
        fi

    - name: Verify referenced release versions
      run: |
        set -euo pipefail
        auto_schema_version="$(cat release_image/auto_schema_version.txt)"
        tsent_version="$(cat release_image/tsent_version.txt)"

        python3 -m pip download --no-deps --dest /tmp/auto-schema-check "auto_schema==${auto_schema_version}"
        go list -m "github.com/lolopinto/ent@${tsent_version}"

    - name: Test release image tooling
      env:
        # hack to avoid hitting the db
        DB_CONNECTION_STRING: sqlite:///
      run: go test ./release_image

    - name: Render release image files
      env:
        # hack to avoid hitting the db
        DB_CONNECTION_STRING: sqlite:///
      run: cd release_image && go run .

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: go.sum

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: docker login
      env:
        DOCKER_TOKEN: ${{secrets.DOCKER_TOKEN}}
      run: echo $DOCKER_TOKEN | docker login ghcr.io -u USERNAME --password-stdin

    - name: build the image
      env:
        # hack to avoid hitting the db
        DB_CONNECTION_STRING: sqlite:///
      run: cd release_image && go run . --push
